# Save this file in your repo as .github/workflows/capture.yml
name: Capture booking pages

on:
  schedule:
    # Cron is in UTC. Each target time is listed twice (summer + winter);
    # the gate step below skips whichever one lands outside the right Dublin window.
    # Early run ~20:05 Dublin, late run ~21:35 Dublin (buffer for GitHub's delays).
    - cron: "5 19 * * 1-4"
    - cron: "5 20 * * 1-4"
    - cron: "35 20 * * 1-4"
    - cron: "35 21 * * 1-4"
  workflow_dispatch: {}   # lets you press "Run workflow" to test

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check Dublin time window
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          H=$((10#$(TZ=Europe/Dublin date +%H)))
          M=$((10#$(TZ=Europe/Dublin date +%M)))
          if { [ $H -eq 20 ] && [ $M -lt 30 ]; } || { [ $H -eq 21 ] && [ $M -ge 30 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install Playwright
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Capture
        if: steps.gate.outputs.go == 'true'
        run: python capture.py

      - name: Commit results
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "padel-tracker"
          git config user.email "padel-tracker@users.noreply.github.com"
          git add screenshots log.csv
          git commit -m "Capture $(TZ=Europe/Dublin date +'%Y-%m-%d %H:%M')" || exit 0
          git push
